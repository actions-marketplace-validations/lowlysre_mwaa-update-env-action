<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MWAA Update Environment</title>
  <desc id="desc">Social card: update an Amazon MWAA environment from GitHub Actions and wait until it is AVAILABLE. A workflow step on the right, with the outputs it returns below it.</desc>
  <!-- Palette: the four Apache Airflow pinwheel blades, green, blue, cyan, and red (tones from
       airflow-core/docs/img/logos/wordmark_1.svg), on Airflow's brand-950 navy. -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#11e1ee" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="1080" cy="20" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#017cee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#017cee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="120" cy="660" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ad46" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00ad46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="80" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04d659"/>
      <stop offset="0.5" stop-color="#11e1ee"/>
      <stop offset="1" stop-color="#0cb6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0a2231"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Mark: an update arrow closing around a check that ends in the lowlysre worm. 64-unit grid. -->
  <g transform="translate(78 78) scale(0.875)">
    <rect x="4" y="4" width="56" height="56" rx="12" fill="#0f3350" stroke="#1d4f73" stroke-width="1.5"/>
    <path d="M39.5 19A15 15 0 1 1 24.5 19" fill="none" stroke="#0cb6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M17.6 17.4L24.5 19L22.3 25.9" fill="none" stroke="#0cb6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 33.5L28.5 38L36.5 29.5" fill="none" stroke="#04d659" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="33.5" r="2.6" fill="#04d659"/>
    <circle cx="37.7" cy="28.2" r="4" fill="#04d659"/>
    <circle cx="38.9" cy="27" r="1" fill="#0f3350"/>
  </g>

  <g font-family="Segoe UI" font-weight="700" font-size="72" fill="url(#title)">
    <text x="78" y="226">MWAA Update</text>
    <text x="78" y="306">Environment</text>
  </g>
  <g font-family="Segoe UI" font-size="25" fill="#d6e4ee">
    <text x="80" y="374">Update an Amazon MWAA environment from</text>
    <text x="80" y="408">GitHub Actions and wait until it's AVAILABLE.</text>
  </g>
  <g transform="translate(80 446)">
    <rect width="44" height="4" rx="2" fill="#04d659"/>
    <rect x="48" width="44" height="4" rx="2" fill="#0cb6ff"/>
    <rect x="96" width="44" height="4" rx="2" fill="#11e1ee"/>
    <rect x="144" width="44" height="4" rx="2" fill="#ff7557"/>
  </g>
  <text x="80" y="548" font-family="Cascadia Mono" font-size="19" fill="#8fb3c9">lowlysre/mwaa-update-env-action</text>
  <text x="80" y="580" font-family="Segoe UI" font-size="16" fill="#5f7d92">Not affiliated with AWS or the Apache Software Foundation.</text>

  <!-- Right column: two cards, 510 wide at x=690, 20px apart, stack centred vertically.
       Card header 48px with the label at y=31 (15px). Workflow YAML is 18px, first baseline
       y=96, 36px pitch. Outputs are 18px, first baseline y=86, 32px pitch, value column x=296
       with an r=5 status dot at x=281. Each card ends 24px below its last baseline. -->
  <!-- Workflow file card -->
  <g transform="translate(690 73)">
    <rect width="510" height="300" rx="12" fill="#0e2b40" stroke="#1d4f73" stroke-width="1.5"/>
    <path d="M0 48H510" stroke="#1d4f73" stroke-width="1.5"/>
    <text x="26" y="31" font-family="Cascadia Mono" font-size="15" fill="#8fb3c9">.github/workflows/deploy.yml</text>
    <g font-family="Cascadia Mono" font-size="18" fill="#8fb3c9" xml:space="preserve">
      <text x="26" y="96">- <tspan fill="#6cc4ff">id</tspan>: <tspan fill="#7be8a6">mwaa</tspan></text>
      <text x="26" y="132">  <tspan fill="#6cc4ff">uses</tspan>: <tspan fill="#11e1ee">lowlysre/mwaa-update-env-action@v1</tspan></text>
      <text x="26" y="168">  <tspan fill="#6cc4ff">with</tspan>:</text>
      <text x="26" y="204">    <tspan fill="#6cc4ff">name</tspan>: <tspan fill="#7be8a6">my-environment</tspan></text>
      <text x="26" y="240">    <tspan fill="#6cc4ff">max-workers</tspan>: <tspan fill="#ff7557">10</tspan></text>
      <text x="26" y="276">    <tspan fill="#6cc4ff">wait</tspan>: <tspan fill="#ff7557">true</tspan></text>
    </g>
  </g>

  <!-- Outputs card -->
  <g transform="translate(690 393)">
    <rect width="510" height="174" rx="12" fill="#0e2b40" stroke="#1d4f73" stroke-width="1.5"/>
    <path d="M0 48H510" stroke="#1d4f73" stroke-width="1.5"/>
    <text x="26" y="31" font-family="Cascadia Mono" font-size="15" fill="#8fb3c9">steps.mwaa.outputs</text>
    <g font-family="Cascadia Mono" font-size="18" fill="#8fb3c9">
      <text x="26" y="86">status</text>
      <circle cx="281" cy="80" r="5" fill="#04d659"/>
      <text x="296" y="86" fill="#7be8a6">AVAILABLE</text>
      <text x="26" y="118">last-update-status</text>
      <circle cx="281" cy="112" r="5" fill="#04d659"/>
      <text x="296" y="118" fill="#7be8a6">SUCCESS</text>
      <text x="26" y="150">airflow-version</text>
      <text x="296" y="150" fill="#e6f0f7">2.10.3</text>
    </g>
  </g>
</svg>
