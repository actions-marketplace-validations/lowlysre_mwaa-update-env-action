# yaml-language-server: $schema=https://raw.githubusercontent.com/oxsecurity/megalinter/main/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json
APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
PRINT_ALPACA: false
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
UPDATED_SOURCES_REPORTER: false

JAVASCRIPT_DEFAULT_STYLE: prettier
TYPESCRIPT_DEFAULT_STYLE: prettier

# Generated or vendored files.
FILTER_REGEX_EXCLUDE: (dist/|node_modules/|package-lock\.json|docs/public/)

# The egress policy blocks everything except the endpoints listed in the workflow, so linters
# that download data at run time (vulnerability databases, schema catalogs, link checks) stay
# off. zizmor runs as its own CI job.
DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - REPOSITORY_TRIVY
  - REPOSITORY_TRIVY_SBOM
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_CHECKOV
  - COPYPASTE_JSCPD
  - SPELL_LYCHEE
  - JSON_V8R
  - YAML_V8R
